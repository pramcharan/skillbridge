
services:
  postgres:
    image: postgres:15
    container_name: skillbridge-postgres
    restart: always
    environment:
      POSTGRES_DB: skillbridge_db
      POSTGRES_USER: sbuser
      POSTGRES_PASSWORD: sbpassword
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - skillbridge_postgres_data:/var/lib/postgresql/data

volumes:
  skillbridge_postgres_data: