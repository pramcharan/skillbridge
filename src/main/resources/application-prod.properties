spring.application.name=skillbridge

# Server
server.port=${PORT:8080}

# Database (PostgreSQL / Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-snowy-glade-aobetlfs.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_X2axb5prOWmL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JPA / Hibernate for Production
# IMPORTANT: Using 'update' for initial deployment to auto-create PostgreSQL schema. 
# Revert to 'validate' or 'none' after the first successful run.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=ERROR

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.reset-token-expiry-minutes=30

# OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy-github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Suppress favicon.ico 404 noise in console
spring.mvc.favicon.enabled=false
logging.level.org.springframework.web.servlet.resource=OFF

# AI Provider Config
app.ai.provider=${APP_AI_PROVIDER:openrouter}

# OpenRouter
app.ai.openrouter.base-url=https://openrouter.ai/api/v1
app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.openrouter.primary-model=openai/gpt-oss-120b:free
app.ai.openrouter.backup-model=qwen/qwen3.6-plus:free
app.ai.openrouter.timeout-seconds=60
app.ai.ollama.base-url=${OLLAMA_BASE_URL:http://ollama:11434}
app.ai.ollama.model=${OLLAMA_MODEL:mistral:7b-instruct}
app.ai.ollama.timeout-seconds=60


# OpenAI
app.ai.openai.base-url=https://api.openai.com/v1
app.ai.openai.model=gpt-4o-mini
app.ai.openai.api-key=${OPENAI_API_KEY:}

spring.data.web.pageable.serialize-page-content-as-list=true

app.upload.dir=uploads
app.upload.max-size-mb=5

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# JWT
app.jwt.secret=${APP_JWT_SECRET:dummy-jwt-secret-key-that-is-at-least-32-bytes-long-for-hmac-sha256}
app.jwt.expiration=86400000
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:8080}


# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}

# Connection pool (HikariCP) optimizations for production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA performance optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100

# Disable open-session-in-view (prevents lazy loading outside transactions)
spring.jpa.open-in-view=false

# Cache static assets
spring.web.resources.cache.period=864000
spring.web.resources.chain.enabled=true

# Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/css,text/html
server.compression.min-response-size=1024

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true


