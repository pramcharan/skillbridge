spring.application.name=skillbridge

# Server
server.port=8080

# Database (Docker on port 3307 locally, env var for production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/skillbridge_db?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sbuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sbpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true


app.base-url=${APP_BASE_URL:http://localhost:8080}
app.reset-token-expiry-minutes=30

# OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy-github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Suppress favicon.ico 404 noise in console
spring.mvc.favicon.enabled=false
logging.level.org.springframework.web.servlet.resource=OFF

# AI Provider Config
app.ai.provider=openrouter

# OpenRouter
app.ai.openrouter.base-url=https://openrouter.ai/api/v1
app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
# Primary model
app.ai.openrouter.primary-model=openai/gpt-oss-120b:free

# Backup model
app.ai.openrouter.backup-model=qwen/qwen3.6-plus:free
app.ai.openrouter.timeout-seconds=60

# AI Provider Config
#app.ai.provider=ollama

# Ollama
app.ai.ollama.base-url=http://localhost:11434
app.ai.ollama.model=mistral:7b-instruct
app.ai.ollama.timeout-seconds=60

# OpenAI (fill in when going to production)
app.ai.openai.base-url=https://api.openai.com/v1
app.ai.openai.model=gpt-4o-mini
app.ai.openai.api-key=${OPENAI_API_KEY:}


spring.data.web.pageable.serialize-page-content-as-list=true

app.upload.dir=uploads
app.upload.max-size-mb=5

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# JWT
app.jwt.secret=${APP_JWT_SECRET:dummy-jwt-secret-key-that-is-at-least-32-bytes-long-for-hmac-sha256}
app.jwt.expiration=86400000

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}


# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA performance
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# Disable open-session-in-view (prevents lazy loading outside transactions)
spring.jpa.open-in-view=false

# Logging ? disable in production
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF

# Cache static assets
spring.web.resources.cache.period=86400
spring.web.resources.chain.enabled=true

# Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/css,text/html
server.compression.min-response-size=1024


